<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teenz Chatroom</title>

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body,html{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}

/* BACKGROUND VIDEO */
#bgVideo{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:-1;
}

/* MAIN LAYOUT */
#app{display:flex;height:100%}
#sidebar{
  width:260px;
  background:rgba(20,0,40,.95);
  padding:10px;
  overflow-y:auto;
}
#main{
  flex:1;
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(6px);
}

/* CHAT */
#messages{flex:1;overflow-y:auto;padding:10px}
.msg{margin:6px 0;padding:8px;border-radius:8px;max-width:75%}
.me{background:#4b2cff;margin-left:auto}
.other{background:#333}

#inputBar{
  display:flex;
  padding:10px;
  background:#1a0033;
}
#inputBar input{flex:1;padding:8px;border:none;border-radius:6px}
#inputBar button{margin-left:6px}

/* LOGIN */
#auth{
  position:fixed;inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}
#auth form{
  background:#111;
  padding:20px;
  width:300px;
  border-radius:10px;
}

/* SECTIONS */
.sectionTitle{margin:10px 0;font-weight:bold}
.userItem{padding:6px;cursor:pointer;border-bottom:1px solid #333}
.userItem:hover{background:#222}

/* HIDE */
.hidden{display:none}
</style>
</head>

<body>

<video id="bgVideo" autoplay loop muted>
  <source src="https://raw.githubusercontent.com/hack256-tech/chat-alive/main/videos/FPV_Drone_Flight_through_Beautiful_Iceland_Canyon(360p).mp4" type="video/mp4">
</video>

<div id="auth">
<form id="authForm">
<h3>Teenz Chatroom</h3>
<input id="email" type="email" placeholder="Email" required><br><br>
<input id="password" type="password" placeholder="Password" required><br><br>

<label>
<input type="checkbox" id="agree">
 I agree to Terms & Privacy (13+)
</label><br><br>

<button type="submit">Sign Up / Login</button>
<button type="button" id="googleBtn">Continue with Google</button>
</form>
</div>

<div id="app" class="hidden">
<div id="sidebar">
<div class="sectionTitle">Users</div>
<div id="users"></div>

<div class="sectionTitle">Updates</div>
<div id="updates"></div>

<div class="sectionTitle">Feedback</div>
<textarea id="feedbackText" placeholder="Tell admin..."></textarea>
<button onclick="sendFeedback()">Send</button>
</div>

<div id="main">
<div id="messages"></div>

<div id="inputBar">
<input id="msgInput" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
<button onclick="sendVoice()">🎤</button>
<button onclick="sendFile()">🔗</button>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwQze1X6YvdNs3TT_12wgcXBCh_ETbJUw",
  authDomain: "chat-alive-7c867.firebaseapp.com",
  databaseURL: "https://chat-alive-7c867-default-rtdb.firebaseio.com",
  projectId: "chat-alive-7c867",
  storageBucket: "chat-alive-7c867.appspot.com",
  messagingSenderId: "609977939142",
  appId: "1:609977939142:web:fdc6779a6c1e21733793c7"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();
const storage=firebase.storage();

let currentUser=null;
let currentChat="public";

const bg=document.getElementById("bgVideo");

function speak(text){
  bg.muted=true;
  const u=new SpeechSynthesisUtterance(text);
  u.onend=()=>bg.muted=false;
  speechSynthesis.speak(u);
}

/* AUTH */
document.getElementById("authForm").onsubmit=e=>{
 e.preventDefault();
 if(!agree.checked){alert("Agree to terms");return;}
 auth.signInWithEmailAndPassword(email.value,password.value)
 .catch(()=>auth.createUserWithEmailAndPassword(email.value,password.value));
};

googleBtn.onclick=()=>{
 const provider=new firebase.auth.GoogleAuthProvider();
 auth.signInWithPopup(provider);
};

auth.onAuthStateChanged(u=>{
 if(u){
   currentUser=u;
   authDiv.classList.add("hidden");
   app.classList.remove("hidden");
   speak("Welcome to Teenz Chatroom. Admin is glad you joined.");
   loadUsers();
   loadMessages();
 }
});

/* USERS */
function loadUsers(){
 db.ref("users").on("value",s=>{
   users.innerHTML="";
   s.forEach(u=>{
     const d=document.createElement("div");
     d.className="userItem";
     d.textContent=u.val().name||u.key;
     d.onclick=()=>{currentChat=u.key;messages.innerHTML="";loadMessages();}
     users.appendChild(d);
   });
 });
 db.ref("users/"+currentUser.uid).set({
   name:currentUser.email
 });
}

/* MESSAGES */
function loadMessages(){
 db.ref("chats/"+currentChat).limitToLast(100).on("child_added",s=>{
   const m=s.val();
   if(Date.now()-m.time>7*24*60*60*1000 && !m.star)return;
   const div=document.createElement("div");
   div.className="msg "+(m.uid===currentUser.uid?"me":"other");
   div.textContent=m.text||"[media]";
   messages.appendChild(div);
   messages.scrollTop=messages.scrollHeight;
 });
}

function sendMessage(){
 if(!msgInput.value)return;
 db.ref("chats/"+currentChat).push({
   uid:currentUser.uid,
   text:msgInput.value,
   time:Date.now()
 });
 msgInput.value="";
}

/* FEEDBACK */
function sendFeedback(){
 db.ref("feedback").push({
   uid:currentUser.uid,
   text:feedbackText.value,
   time:Date.now()
 });
 feedbackText.value="";
}

/* FILE */
function sendFile(){
 const i=document.createElement("input");
 i.type="file";
 i.onchange=()=>{
   const f=i.files[0];
   const ref=storage.ref("files/"+Date.now()+f.name);
   ref.put(f).then(s=>s.ref.getDownloadURL()).then(url=>{
     db.ref("chats/"+currentChat).push({
       uid:currentUser.uid,
       file:url,
       time:Date.now()
     });
   });
 };
 i.click();
}

/* VOICE */
function sendVoice(){
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
   const rec=new MediaRecorder(stream);
   rec.start();
   setTimeout(()=>rec.stop(),5000);
   rec.ondataavailable=e=>{
     const ref=storage.ref("voice/"+Date.now()+".webm");
     ref.put(e.data).then(s=>s.ref.getDownloadURL()).then(url=>{
       db.ref("chats/"+currentChat).push({
         uid:currentUser.uid,
         voice:url,
         time:Date.now()
       });
     });
   };
 });
}

/* SERVICE WORKER */
if("serviceWorker"in navigator){
 navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
