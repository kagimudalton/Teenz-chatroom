<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teenz Chatroom</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a0dad">

<style>
/* General styles */
body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}
header {
    background-color: #6a0dad;
    color: #fff;
    padding: 15px;
    text-align: center;
    font-size: 1.5em;
}
#homepage {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
}
#bgVideo {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}
#voice-guide {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: #fff;
    font-size: 1.2em;
    background-color: rgba(0,0,0,0.4);
    padding: 10px;
    border-radius: 10px;
}
#chatroom {
    display: none;
    background-color: #f5f5f5;
    height: 100vh;
    width: 100%;
}
#sidebar {
    width: 250px;
    background-color: #fff;
    float: left;
    height: 100%;
    overflow-y: auto;
    border-right: 1px solid #ccc;
}
#chat-section {
    margin-left: 250px;
    height: 100%;
    display: flex;
    flex-direction: column;
}
#messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}
.message {
    margin: 5px 0;
    padding: 8px;
    border-radius: 5px;
    max-width: 70%;
}
.message.self {
    background-color: #d1ffd6;
    align-self: flex-end;
}
.message.other {
    background-color: #f0f0f0;
    align-self: flex-start;
}
#input-section {
    display: flex;
    padding: 10px;
    background-color: #eee;
}
#message-input {
    flex: 1;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
#send-btn, #sticker-btn, #attach-btn {
    margin-left: 5px;
    padding: 8px 12px;
    border: none;
    background-color: #6a0dad;
    color: #fff;
    border-radius: 5px;
    cursor: pointer;
}
#sticker-menu {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 10px;
    background-color: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 10px;
    max-height: 200px;
    overflow-y: auto;
}
.sticker {
    width: 50px;
    height: 50px;
    margin: 5px;
    cursor: pointer;
}
.form-container {
    max-width: 400px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}
input[type="text"], input[type="password"], input[type="email"] {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button {
    width: 100%;
    padding: 10px;
    background-color: #6a0dad;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
.checkbox-container {
    text-align: left;
    margin: 10px 0;
}
</style>
</head>
<body>

<header>Teenz Chatroom</header>

<!-- Homepage with Background Video -->
<div id="homepage">
    <video id="bgVideo" autoplay muted loop>
        <source src="https://raw.githubusercontent.com/kagimudalton/Teenz-chatroom-videos/main/Warner_Bros_Pictures_Intro__2025_(360p).mp4" type="video/mp4">
        <source src="https://raw.githubusercontent.com/kagimudalton/Teenz-chatroom-videos/main/Universal_Intro_4K(360p).mp4" type="video/mp4">
        <source src="https://raw.githubusercontent.com/kagimudalton/Teenz-chatroom-videos/main/Stranger_Things_Season_6_-_Trailer__2026__Netflix(360p).mp4" type="video/mp4">
    </video>
    <div id="voice-guide">Welcome to Teenz Chatroom! The admin is glad you joined. Explore public chats or create your own group.</div>
</div>

<!-- Chatroom -->
<div id="chatroom">
    <div id="sidebar">
        <h3>Online Users</h3>
        <div id="online-users"></div>
        <h3>Groups</h3>
        <div id="groups"></div>
        <h3>Communities</h3>
        <div id="communities"></div>
        <h3>Settings</h3>
        <div id="settings"></div>
    </div>
    <div id="chat-section">
        <div id="messages"></div>
        <div id="input-section">
            <button id="sticker-btn">🫡</button>
            <button id="attach-btn">🔗</button>
            <input type="text" id="message-input" placeholder="Type a message">
            <button id="send-btn">Send</button>
            <div id="sticker-menu">
                <!-- Stickers / Bitmoji -->
                <img src="https://raw.githubusercontent.com/kagimudalton/Teenz-chatroom-videos/main/sample-sticker1.png" class="sticker">
                <img src="https://raw.githubusercontent.com/kagimudalton/Teenz-chatroom-videos/main/sample-sticker2.png" class="sticker">
            </div>
        </div>
    </div>
</div>

<!-- Sign Up / Login Form -->
<div class="form-container" id="auth-form">
    <h2>Sign Up / Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <div class="checkbox-container">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>. Minimum age: 13</label>
    </div>
    <button id="signup-btn">Sign Up</button>
    <button id="login-btn">Login</button>
    <button id="google-btn">Continue with Google</button>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAwQze1X6YvdNs3TT_12wgcXBCh_ETbJUw",
  authDomain: "chat-alive-7c867.firebaseapp.com",
  projectId: "chat-alive-7c867",
  storageBucket: "chat-alive-7c867.appspot.com",
  messagingSenderId: "609977939142",
  appId: "1:609977939142:web:fdc6779a6c1e21733793c7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getDatabase();

// DOM elements
const signupBtn = document.getElementById('signup-btn');
const loginBtn = document.getElementById('login-btn');
const googleBtn = document.getElementById('google-btn');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const termsCheck = document.getElementById('terms');
const authForm = document.getElementById('auth-form');
const chatroom = document.getElementById('chatroom');
const homepage = document.getElementById('homepage');
const messageInput = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const messagesDiv = document.getElementById('messages');
const stickerBtn = document.getElementById('sticker-btn');
const stickerMenu = document.getElementById('sticker-menu');

// Auth functions
signupBtn.onclick = () => {
    if (!termsCheck.checked) { alert("Please agree to Terms & Conditions."); return; }
    createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
    .then(() => { showChatroom(); })
    .catch(e => alert(e.message));
};
loginBtn.onclick = () => {
    if (!termsCheck.checked) { alert("Please agree to Terms & Conditions."); return; }
    signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
    .then(() => { showChatroom(); })
    .catch(e => alert(e.message));
};
googleBtn.onclick = () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider)
    .then(() => { showChatroom(); })
    .catch(e => alert(e.message));
};

function showChatroom() {
    authForm.style.display = 'none';
    homepage.style.display = 'none';
    chatroom.style.display = 'flex';
}

// Sending messages
sendBtn.onclick = () => {
    const msg = messageInput.value.trim();
    if (msg) {
        const messagesRef = ref(db, 'messages');
        push(messagesRef, { text: msg, sender: auth.currentUser.uid, timestamp: Date.now() });
        messageInput.value = '';
    }
};

// Display messages
const messagesRef = ref(db, 'messages');
onValue(messagesRef, (snapshot) => {
    messagesDiv.innerHTML = '';
    snapshot.forEach(child => {
        const msg = child.val();
        const div = document.createElement('div');
        div.className = 'message ' + (msg.sender === auth.currentUser?.uid ? 'self' : 'other');
        div.textContent = msg.text;
        messagesDiv.appendChild(div);
    });
});

// Sticker menu toggle
stickerBtn.onclick = () => stickerMenu.style.display = stickerMenu.style.display === 'none' ? 'flex' : 'none';
stickerMenu.querySelectorAll('.sticker').forEach(s => {
    s.onclick = () => {
        const messagesRef = ref(db, 'messages');
        push(messagesRef, { sticker: s.src, sender: auth.currentUser.uid, timestamp: Date.now() });
        stickerMenu.style.display = 'none';
    };
});
</script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').then(() => {
        console.log('Service Worker Registered');
    });
}
</script>

</body>
</html>
